<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pesquisa de ideias — Will &amp; Lucas (versão editável)</title>
<meta name="description" content="Planilha interativa de pesquisa de ideias: pontuação com ranking automático, dores do Lucas, matriz de validação, plano de ação e registro de entrevistas. Funciona offline; os dados ficam no seu navegador.">
<style>
/* ==========================================================================
   Pesquisa de ideias — Will & Lucas (versão editável)
   Convenção visual herdada da planilha:
     amarelo + texto azul  = campo para preencher
     cinza itálico         = exemplo (não conta)
     cinza claro em negrito= calculado automaticamente
     branco                = texto fixo
   ========================================================================== */
:root {
  --navy: #1f3864;
  --navy-dark: #162847;
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --ink: #111827;
  --muted: #6b7280;
  --line: #d3d8e0;
  --line-soft: #e8ebf0;
  --bg: #f3f5f9;
  --card: #ffffff;
  --in-bg: #fff2cc;
  --in-bg-hover: #ffeeb8;
  --in-bg-focus: #ffe7a0;
  --in-fg: #0a2fc4;
  --ex-bg: #ededed;
  --ex-fg: #7f7f7f;
  --calc-bg: #f0f2f6;
  --warn-bg: #fef3c7;
  --warn-fg: #92400e;
  --ok-bg: #dcfce7;
  --ok-fg: #166534;
  --bad-bg: #fee2e2;
  --bad-fg: #991b1b;
  --info-bg: #eff6ff;
  --info-fg: #1e3a8a;
  --radius: 10px;
  --topbar-h: 56px;
  --sticky-h: 104px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
[hidden] { display: none !important; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- topo */
.topbar {
  position: sticky; top: 0; z-index: 60;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding: 8px 16px;
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 280px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .tag { font-size: 11px; font-weight: 600; background: rgba(255,255,255,.16); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.save-status { font-size: 12px; opacity: .92; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; }
.save-status.saving .dot { background: #fbbf24; }
.save-status.error .dot { background: #f87171; }
.save-status.error { opacity: 1; color: #fecaca; }

.btn {
  appearance: none; border: 1px solid transparent; border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13px; line-height: 1.2;
  background: #fff; color: var(--navy); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { filter: brightness(.96); }
.btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.ghost { background: transparent; color: inherit; border-color: rgba(255,255,255,.4); }
.topbar .btn.ghost:hover { background: rgba(255,255,255,.12); filter: none; }
.btn.line { background: #fff; border-color: var(--line); color: var(--navy); }
.btn.danger { background: #fff; border-color: #fca5a5; color: #b91c1c; }
.btn.small { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn .pip { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }

.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 80; min-width: 230px; max-width: calc(100vw - 20px);
  background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, .18); padding: 6px; display: flex; flex-direction: column;
}
.menu .menu-list button {
  text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 13px;
}
.menu .menu-list button:hover { background: #f3f4f6; }
.menu .menu-list button.danger { color: #b91c1c; }
.menu .menu-list hr { border: 0; border-top: 1px solid var(--line-soft); margin: 4px 0; width: 100%; }

/* ---------------------------------------------------------------- abas */
.tabs {
  position: sticky; top: var(--topbar-h); z-index: 50;
  background: #fff; border-bottom: 1px solid var(--line);
  display: flex; overflow-x: auto; gap: 2px; padding: 0 10px;
  scrollbar-width: thin;
}
.tab {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  padding: 11px 13px 9px; color: var(--muted); font-size: 13px; white-space: nowrap;
  border-bottom: 3px solid transparent; display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--navy); background: #f8fafc; }
.tab[aria-selected="true"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--blue); }
.tab:focus-visible { outline: 3px solid #93c5fd; outline-offset: -3px; }
.tab .new { font-size: 10px; font-weight: 700; background: #dcfce7; color: #166534; border-radius: 99px; padding: 1px 6px; }

/* ---------------------------------------------------------------- painel */
.panel { max-width: 1760px; margin: 0 auto; padding: 14px 16px 60px; }
.panel h2 { margin: 6px 0 2px; font-size: 20px; color: var(--navy); }
.panel h3 { margin: 18px 0 6px; font-size: 15px; color: var(--navy); }
.lead { margin: 2px 0 10px; color: var(--muted); font-size: 13px; }

.callout { border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 13px; line-height: 1.5; }
.callout.warn { background: var(--warn-bg); color: var(--warn-fg); font-style: italic; }
.callout.info { background: var(--info-bg); color: var(--info-fg); }
.callout.neutral { background: #f8fafc; border: 1px solid var(--line-soft); color: #374151; }
.callout b { font-style: normal; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
.legend .sw { display: inline-block; width: 26px; height: 16px; border-radius: 4px; border: 1px solid var(--line); vertical-align: -3px; margin-right: 5px; }
.legend .sw.in { background: var(--in-bg); color: var(--in-fg); font-size: 10px; font-weight: 700; text-align: center; line-height: 14px; }
.legend .sw.ex { background: var(--ex-bg); }
.legend .sw.calc { background: var(--calc-bg); }
.legend .sw.fix { background: #fff; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 10px 0; }
.toolbar .grow { flex: 1 1 auto; }
.toolbar label.inline { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.toolbar input[type="number"], .toolbar input[type="date"], .toolbar input[type="text"] {
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--in-bg); color: var(--in-fg); font-weight: 600; width: 92px;
}
.toolbar input[type="date"] { width: 150px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 12px; color: #374151; }
.chip b { color: var(--navy); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.kpi .n { font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1.1; }
.kpi .t { font-size: 12px; color: var(--muted); }
.kpi .bar { height: 5px; border-radius: 3px; background: var(--line-soft); margin-top: 7px; overflow: hidden; }
.kpi .bar > i { display: block; height: 100%; background: var(--blue); }

/* ---------------------------------------------------------------- tabela estilo planilha */
.tablewrap {
  overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  max-height: calc(100vh - var(--sticky-h) - 18px);
  margin: 8px 0 14px; position: relative;
}
table.sheet { border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 100%; font-size: 13px; }
.sheet th, .sheet td {
  border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
  padding: 0; vertical-align: top; background: #fff; text-align: left;
}
.sheet th:last-child, .sheet td:last-child { border-right: 0; }
.sheet thead th {
  position: sticky; top: 0; z-index: 4; background: var(--navy); color: #fff;
  padding: 8px 8px; font-size: 12px; font-weight: 700; line-height: 1.25; vertical-align: middle;
  border-right-color: rgba(255,255,255,.18); border-bottom: 0;
}
.sheet thead th.c { text-align: center; }
.sheet thead th[title] { cursor: help; }
.sheet td.fx { padding: 7px 9px; }
.sheet td.c, .sheet td.num { text-align: center; }
.sheet td.fx.small { font-size: 12px; color: #374151; }
.sheet td.id { text-align: center; font-weight: 700; color: var(--navy); padding: 7px 4px; }
.sheet td.calc { background: var(--calc-bg); font-weight: 700; text-align: center; padding: 7px 6px; vertical-align: middle; }
.sheet td.in { background: var(--in-bg); color: var(--in-fg); padding: 0; }
.sheet td.in:hover { background: var(--in-bg-hover); }
.sheet td.in:focus-within { background: var(--in-bg-focus); box-shadow: inset 0 0 0 2px var(--blue); }
.sheet td.in > input, .sheet td.in > textarea, .sheet td.in > select, .sheet td.in .cellfield {
  display: block; width: 100%; border: 0; background: transparent; color: var(--in-fg);
  padding: 7px 9px; margin: 0; border-radius: 0; outline: none; font-size: 13px; line-height: 1.4;
}
.sheet td.in > textarea { resize: none; overflow: hidden; min-height: 34px; display: block; }
.sheet td.in > select { cursor: pointer; padding-right: 2px; }
.sheet td.in > input::placeholder, .sheet td.in > textarea::placeholder { color: rgba(10, 47, 196, .36); font-style: italic; }
.sheet td.in.score > input { text-align: center; font-weight: 700; font-size: 15px; padding: 8px 2px; }
.sheet td.in.bad { background: #fecaca !important; }
.sheet tr.example td { background: var(--ex-bg) !important; color: var(--ex-fg); font-style: italic; }
.sheet tr.example td.calc { background: #e3e3e3 !important; }
.sheet tr.weights td { background: #fff8e1; border-bottom: 2px solid var(--line); }
.sheet tr.weights td.lab { text-align: right; font-weight: 700; color: var(--navy); padding: 8px 10px; vertical-align: middle; background: #fff; }
.sheet tr.weights td.note { color: var(--muted); font-style: italic; font-size: 12px; padding: 8px 8px; vertical-align: middle; background: #fff; }
.sheet tr.detail > td { background: #fafbfd; padding: 12px 14px 14px; }
.sheet tr:hover > td.fx, .sheet tr:hover > td.id { background: #fbfcfe; }
.sheet tr.example:hover > td { background: var(--ex-bg) !important; }

.sticky-l { position: sticky; z-index: 3; }
.sheet thead th.sticky-l { z-index: 6; }
.sheet td.sticky-l { background: #fff; }
.sheet tr:hover > td.sticky-l { background: #fbfcfe; }
.sheet tr.example td.sticky-l { background: var(--ex-bg) !important; }
.sheet tr.weights td.sticky-l { background: #fff; }
.sticky-edge { box-shadow: 2px 0 0 var(--line); }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; line-height: 1.5; white-space: nowrap;
}
.badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
.badge.bad { background: var(--bad-bg); color: var(--bad-fg); }
.badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
.badge.gray { background: #e5e7eb; color: #374151; }
.badge.blue { background: var(--blue-soft); color: #1e40af; }

.prio-first { background: #dcfce7 !important; }
.prio-later { background: #fef3c7 !important; }
.prio-low { background: #fee2e2 !important; }
.prio-drop { background: #e5e7eb !important; }
.st-pend { background: #f3f4f6 !important; }
.st-prep { background: #e0f2fe !important; }
.st-run { background: #fef3c7 !important; }
.st-done { background: #dcfce7 !important; }
.st-pause { background: #ede9fe !important; }
.st-drop { background: #fee2e2 !important; }

.cell-actions { display: flex; flex-direction: column; gap: 4px; padding: 6px; align-items: stretch; }
.cell-actions .btn { justify-content: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #d1d5db; vertical-align: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.r { text-align: right; }
.link { color: var(--blue); text-decoration: underline; word-break: break-all; }

.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 14px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > label, .field > .lbl { font-size: 11px; font-weight: 700; color: var(--navy); text-transform: none; letter-spacing: .1px; }
.field > .hint { font-size: 11px; color: var(--muted); }
.field .ctl {
  background: var(--in-bg); color: var(--in-fg); border: 1px solid #f0dc9b; border-radius: 6px; padding: 7px 9px; width: 100%;
  font-size: 13px; line-height: 1.4; resize: none; overflow: hidden; min-height: 34px;
}
.field .ctl:hover { background: var(--in-bg-hover); }
.field .ctl:focus { background: var(--in-bg-focus); outline: 2px solid var(--blue); outline-offset: 0; }
.field select.ctl { cursor: pointer; }
.field .ctl::placeholder { color: rgba(10, 47, 196, .36); font-style: italic; }

/* ---------------------------------------------------------------- fichas (registro de entrevistas) */
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin: 12px 0; overflow: hidden; }
.card > .card-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid var(--line-soft); cursor: pointer; flex-wrap: wrap; }
.card > .card-h .ttl { font-weight: 700; color: var(--navy); flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card > .card-b { padding: 14px; }
.card.collapsed > .card-b { display: none; }
.card .sec { margin: 14px 0 6px; font-size: 12px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--line-soft); padding-bottom: 3px; }
.card .sec:first-child { margin-top: 0; }

/* ---------------------------------------------------------------- texto corrido (Como usar / leitura executiva) */
.prose { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 22px 18px; max-width: 980px; }
.prose h3 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .6px; color: var(--navy); text-transform: uppercase; }
.prose p, .prose li { margin: 4px 0; }
.prose ul { padding-left: 20px; margin: 4px 0 8px; }
.prose .h1 { font-size: 20px; font-weight: 800; color: var(--navy); margin: 14px 0 4px; }
.prose code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.prose details { margin: 10px 0; }
.prose summary { cursor: pointer; font-weight: 700; color: var(--navy); }
.prose kbd { background: #f3f4f6; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
.exec-list { list-style: none; padding: 0; margin: 6px 0; }
.exec-list li { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 8px; padding: 9px 14px; margin: 8px 0; }

/* ---------------------------------------------------------------- toasts e diálogo */
#toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 560px); pointer-events: none; }
.toast { pointer-events: auto; background: #111827; color: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.28); font-size: 13px; display: flex; align-items: center; gap: 12px; max-width: 100%; animation: tin .18s ease-out; }
.toast.err { background: #991b1b; }
.toast.ok { background: #14532d; }
.toast button { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-weight: 700; font-size: 12px; white-space: nowrap; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

dialog.dlg { border: 0; border-radius: 14px; padding: 0; max-width: min(92vw, 480px); width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.35); color: var(--ink); }
dialog.dlg::backdrop { background: rgba(15, 23, 42, .5); }
dialog.dlg .dlg-b { padding: 20px 22px 8px; }
dialog.dlg h4 { margin: 0 0 8px; font-size: 17px; color: var(--navy); }
dialog.dlg p { margin: 0 0 8px; color: #374151; }
dialog.dlg .dlg-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 22px 18px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- celular: tabelas viram cartões */
@media (max-width: 860px) {
  :root { --sticky-h: 112px; }
  .panel { padding: 10px 10px 70px; }
  .brand h1 { font-size: 15px; white-space: normal; }
  .tablewrap:not(.nocard) { max-height: none; overflow: visible; border: 0; background: transparent; }
  .tablewrap.nocard { max-height: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.sheet:not(.nocard) { display: block; width: auto !important; min-width: 0; table-layout: auto; }
  table.sheet:not(.nocard) colgroup, table.sheet:not(.nocard) thead { display: none; }
  table.sheet:not(.nocard) tbody { display: block; }
  table.sheet:not(.nocard) tr { display: block; background: #fff; border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px; overflow: hidden; }
  table.sheet:not(.nocard) td, table.sheet:not(.nocard) th {
    display: block; width: auto !important; border-right: 0; text-align: left; position: static !important; box-shadow: none !important;
  }
  table.sheet:not(.nocard) td[data-label]::before {
    content: attr(data-label); display: block; font-size: 10.5px; font-weight: 800; color: var(--navy);
    padding: 7px 10px 0; letter-spacing: .2px;
  }
  table.sheet:not(.nocard) td.in[data-label]::before { padding-bottom: 0; }
  table.sheet:not(.nocard) td.fx { padding-top: 0; padding-bottom: 7px; }
  table.sheet:not(.nocard) td.fx[data-label]::before { padding-left: 0; padding-right: 0; }
  table.sheet:not(.nocard) td.id, table.sheet:not(.nocard) td.c, table.sheet:not(.nocard) td.calc { text-align: left; }
  table.sheet:not(.nocard) td.score[data-short] { display: inline-block; width: 25% !important; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
  table.sheet:not(.nocard) td.score[data-short]::before { content: attr(data-short); text-align: center; padding: 6px 2px 0; }
  table.sheet:not(.nocard) td.hide-m { display: none; }
  table.sheet:not(.nocard) tr.weights { display: flex; flex-wrap: wrap; }
  table.sheet:not(.nocard) tr.weights td { width: 25% !important; display: block; }
  table.sheet:not(.nocard) tr.weights td.lab, table.sheet:not(.nocard) tr.weights td.note { width: 100% !important; text-align: left; }
  table.sheet:not(.nocard) tr.detail { border-style: dashed; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .toolbar input[type="date"] { width: 100%; }
}

/* ---------------------------------------------------------------- impressão */
@media print {
  :root { --sticky-h: 0px; }
  body { background: #fff; font-size: 11px; }
  .topbar, .tabs, #toasts, .no-print, .cell-actions, .toolbar .btn, .legend { display: none !important; }
  .panel { max-width: none; padding: 0; }
  .tablewrap { max-height: none !important; overflow: visible !important; border: 0; }
  table.sheet { table-layout: auto; min-width: 0; width: 100% !important; font-size: 10px; }
  .sheet thead th { position: static; }
  .sheet th, .sheet td { position: static !important; }
  .sheet td.in, .sheet .field .ctl { background: #fffbe6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet thead th { background: var(--navy) !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet tr { break-inside: avoid; }
  .card.collapsed > .card-b { display: block; }
}

/* ---------------------------------------------------------------- ajustes finais */
.btn.dangerfill { background: #b91c1c; color: #fff; }
.menu > summary::after { content: ""; display: inline-block; border: 4px solid transparent; border-top-color: currentColor; margin: 4px 0 0 2px; }
.sheet td.in.sticky-l, .sheet tr:hover > td.in.sticky-l { background: var(--in-bg); }
.sheet td.in.sticky-l:hover, .sheet tr:hover > td.in.sticky-l:hover { background: var(--in-bg-hover); }
.sheet td.in.sticky-l:focus-within, .sheet tr:hover > td.in.sticky-l:focus-within { background: var(--in-bg-focus); }
.sheet tr.blockstart > td { border-top: 2px solid var(--line); }
.sheet tr.blockstart:first-child > td { border-top: 0; }
.detail-inner { position: sticky; left: 12px; width: min(1040px, calc(100vw - 80px)); }
.toolbar label.inline input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); }
.tablewrap:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
@media (max-width: 860px) {
  .detail-inner { position: static; width: auto; }
  .topbar { padding: 8px 10px; position: static; }
  .tabs { top: 0; }
  .actions { width: 100%; }
}
@media print {
  .detail-inner { position: static; width: auto; }
  .menu, #notices { display: none !important; }
}

.cell-actions { flex-direction: row; flex-wrap: nowrap; align-items: center; justify-content: flex-start; padding: 6px 8px; }
.cell-actions .btn { padding: 4px 8px; }
.sheet td.in.score { vertical-align: middle; }
.sheet td.in { cursor: text; }
.sheet td.in > select, .sheet td.in > select option { cursor: pointer; }
@media (max-width: 860px) { .cell-actions { flex-wrap: wrap; } .sheet td.in.score { vertical-align: top; } }

.sheet thead th { overflow-wrap: anywhere; }

/* barra de progresso compacta dentro de um chip */
.minibar { display: inline-block; width: 72px; height: 5px; border-radius: 3px; background: var(--line); margin-left: 8px; vertical-align: middle; overflow: hidden; }
.minibar > i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .2s; }
@media print { .minibar { display: none; } }

/* impressão: placeholders (dicas em cinza-claro) não devem sair no papel */
@media print { input::placeholder, textarea::placeholder { color: transparent !important; } }
/* cartões no celular: o número (#) alinha com os rótulos */
@media (max-width: 860px) { table.sheet:not(.nocard) td.id { padding: 0 10px 8px; } }

<script>
(function () {
'use strict';
/* ==========================================================================
   Gerador mínimo de .xlsx (sem dependências): strings inline, ZIP sem compressão.
   Suporta: estilos, fórmulas com valor em cache, mesclagens, painéis congelados,
   filtro automático, validação de dados (inteiro e lista) e escala de cores.
   ========================================================================== */
const XLSX_MIN = (() => {
  const enc = new TextEncoder();
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  const esc = (s) => String(s)
    .replace(/[^\t\n\r\u0020-\uD7FF\uE000-\uFFFD\u{10000}-\u{10FFFF}]/gu, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const colName = (n) => {
    let s = '';
    while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s;
  };
  const addr = (r, c) => colName(c) + r;
  const num = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1e12) / 1e12));

  /* ---------------- estilos ---------------- */
  class Styles {
    constructor() {
      this.fonts = ['<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>'];
      this.fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
      this.borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
      this.numFmts = [];
      this.xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
      this.cache = new Map();
      this.pool = { font: new Map(), fill: new Map(), border: new Map() };
    }
    _idx(kind, list, xml) {
      const m = this.pool[kind];
      if (m.has(xml)) return m.get(xml);
      list.push(xml);
      m.set(xml, list.length - 1);
      return list.length - 1;
    }
    font(f) {
      if (!f) return 0;
      const x = '<font>' + (f.b ? '<b/>' : '') + (f.i ? '<i/>' : '') + `<sz val="${f.sz || 11}"/>` +
        (f.color ? `<color rgb="${f.color}"/>` : '') + `<name val="${esc(f.name || 'Calibri')}"/><family val="2"/></font>`;
      return this._idx('font', this.fonts, x);
    }
    fill(rgb) {
      if (!rgb) return 0;
      return this._idx('fill', this.fills, `<fill><patternFill patternType="solid"><fgColor rgb="${rgb}"/><bgColor indexed="64"/></patternFill></fill>`);
    }
    border(kind, color) {
      if (!kind) return 0;
      const c = color || 'FFBFBFBF';
      const side = (n, on) => (on ? `<${n} style="thin"><color rgb="${c}"/></${n}>` : `<${n}/>`);
      const all = kind === 'all';
      return this._idx('border', this.borders, '<border>' + side('left', all) + side('right', all) + side('top', all) + side('bottom', true) + '<diagonal/></border>');
    }
    numFmt(code) {
      if (!code || code === 'General') return 0;
      if (code === '0.00') return 2;
      if (code === '0') return 1;
      let i = this.numFmts.indexOf(code);
      if (i < 0) { this.numFmts.push(code); i = this.numFmts.length - 1; }
      return 164 + i;
    }
    xf(spec) {
      if (!spec) return 0;
      const key = JSON.stringify(spec);
      if (this.cache.has(key)) return this.cache.get(key);
      const fontId = this.font(spec.font), fillId = this.fill(spec.fill), borderId = this.border(spec.border, spec.bcolor), nf = this.numFmt(spec.fmt);
      const al = spec.h || spec.v || spec.wrap
        ? `<alignment${spec.h ? ` horizontal="${spec.h}"` : ''}${spec.v ? ` vertical="${spec.v}"` : ''}${spec.wrap ? ' wrapText="1"' : ''}/>` : '';
      const x = `<xf numFmtId="${nf}" fontId="${fontId}" fillId="${fillId}" borderId="${borderId}" xfId="0"` +
        (nf ? ' applyNumberFormat="1"' : '') + (fontId ? ' applyFont="1"' : '') + (fillId ? ' applyFill="1"' : '') +
        (borderId ? ' applyBorder="1"' : '') + (al ? ' applyAlignment="1">' + al + '</xf>' : '/>');
      this.xfs.push(x);
      const id = this.xfs.length - 1;
      this.cache.set(key, id);
      return id;
    }
    xml() {
      return XML_HEAD + `<styleSheet xmlns="${NS}">` +
        (this.numFmts.length ? `<numFmts count="${this.numFmts.length}">${this.numFmts.map((c, i) => `<numFmt numFmtId="${164 + i}" formatCode="${esc(c)}"/>`).join('')}</numFmts>` : '') +
        `<fonts count="${this.fonts.length}">${this.fonts.join('')}</fonts>` +
        `<fills count="${this.fills.length}">${this.fills.join('')}</fills>` +
        `<borders count="${this.borders.length}">${this.borders.join('')}</borders>` +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        `<cellXfs count="${this.xfs.length}">${this.xfs.join('')}</cellXfs>` +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
        '<dxfs count="0"/><tableStyles count="0" defaultTableStyle="TableStyleMedium9" defaultPivotStyle="PivotStyleLight16"/></styleSheet>';
    }
  }

  /* ---------------- planilha ---------------- */
  class Sheet {
    constructor(name) {
      this.name = name;
      this.cells = new Map();
      this.colWidths = [];
      this.rowHeights = new Map();
      this.merges = [];
      this.freeze = null; // { row, col }: primeira célula rolável
      this.filter = null;
      this.validations = [];
      this.colorScales = [];
      this.zoom = 0;
      this.landscape = true;
    }
    set(r, c, v, style) { this.cells.set(r * 16384 + c, { r, c, v, style }); return this; }
    width(c1, c2, w) { this.colWidths.push({ c1, c2, w }); return this; }
    height(r, h) { this.rowHeights.set(r, h); return this; }
    merge(r1, c1, r2, c2) { this.merges.push(`${addr(r1, c1)}:${addr(r2, c2)}`); return this; }
    whole(sqref, min, max, title, msg) { this.validations.push({ type: 'whole', sqref, f1: String(min), f2: String(max), title, msg }); return this; }
    list(sqref, options) {
      const joined = options.join(',');
      if (joined.length <= 250 && !options.some((o) => /[",]/.test(o))) this.validations.push({ type: 'list', sqref, f1: `"${joined}"` });
      return this;
    }
    scale(sqref, stops, colors) { this.colorScales.push({ sqref, stops, colors }); return this; }

    xml(styles, selected) {
      const byRow = new Map();
      let maxR = 1, maxC = 1;
      for (const cell of this.cells.values()) {
        if (!byRow.has(cell.r)) byRow.set(cell.r, []);
        byRow.get(cell.r).push(cell);
        if (cell.r > maxR) maxR = cell.r;
        if (cell.c > maxC) maxC = cell.c;
      }
      const rowNums = Array.from(new Set([...byRow.keys(), ...this.rowHeights.keys()])).sort((a, b) => a - b);
      let data = '';
      for (const r of rowNums) {
        const ht = this.rowHeights.get(r);
        const cells = (byRow.get(r) || []).sort((a, b) => a.c - b.c);
        data += `<row r="${r}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>`;
        for (const cell of cells) data += cellXml(cell, styles);
        data += '</row>';
      }
      let views = `<sheetView workbookViewId="0"${selected ? ' tabSelected="1"' : ''}${this.zoom ? ` zoomScale="${this.zoom}" zoomScaleNormal="${this.zoom}"` : ''}>`;
      if (this.freeze) {
        const { row, col } = this.freeze;
        const tl = addr(row, col);
        const xs = col > 1 ? ` xSplit="${col - 1}"` : '';
        const ys = row > 1 ? ` ySplit="${row - 1}"` : '';
        const pane = col > 1 && row > 1 ? 'bottomRight' : row > 1 ? 'bottomLeft' : 'topRight';
        views += `<pane${xs}${ys} topLeftCell="${tl}" activePane="${pane}" state="frozen"/>`;
        if (pane === 'bottomRight') views += `<selection pane="topRight"/><selection pane="bottomLeft"/><selection pane="bottomRight" activeCell="${tl}" sqref="${tl}"/>`;
        else views += `<selection pane="${pane}" activeCell="${tl}" sqref="${tl}"/>`;
      }
      views += '</sheetView>';
      let cols = '';
      if (this.colWidths.length) {
        cols = '<cols>' + this.colWidths.slice().sort((a, b) => a.c1 - b.c1).map((k) => `<col min="${k.c1}" max="${k.c2}" width="${k.w}" customWidth="1"/>`).join('') + '</cols>';
      }
      let cf = '';
      this.colorScales.forEach((s, i) => {
        cf += `<conditionalFormatting sqref="${s.sqref}"><cfRule type="colorScale" priority="${i + 1}"><colorScale>` +
          s.stops.map((st) => `<cfvo type="${st.type}"${st.val != null ? ` val="${st.val}"` : ''}/>`).join('') +
          s.colors.map((c) => `<color rgb="${c}"/>`).join('') + '</colorScale></cfRule></conditionalFormatting>';
      });
      let dv = '';
      if (this.validations.length) {
        dv = `<dataValidations count="${this.validations.length}">` + this.validations.map((v) =>
          `<dataValidation type="${v.type}"${v.type === 'whole' ? ' operator="between"' : ''} allowBlank="1" showInputMessage="1" showErrorMessage="1"` +
          (v.title ? ` errorTitle="${esc(v.title)}"` : '') + (v.msg ? ` error="${esc(v.msg)}"` : '') + ` sqref="${v.sqref}">` +
          `<formula1>${esc(v.f1)}</formula1>${v.f2 != null ? `<formula2>${esc(v.f2)}</formula2>` : ''}</dataValidation>`).join('') + '</dataValidations>';
      }
      return XML_HEAD + `<worksheet xmlns="${NS}" xmlns:r="${NS_R}">` +
        `<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>` +

function sanitizeState(saved) {

  if (isObj(saved.meta)) {
    D.meta.createdAt = str(saved.meta.createdAt, 40) || D.meta.createdAt;
    D.meta.changedAt = str(saved.meta.changedAt, 40) || null;
    D.meta.lastBackupAt = str(saved.meta.lastBackupAt, 40) || null;
  }

    D.ui.tab = pick(saved.ui.tab, TAB_IDS, 'analise');
    D.ui.showExIdeas = saved.ui.showExIdeas !== false;
    D.ui.showExDores = saved.ui.showExDores !== false;
    D.ui.sortIdeas = saved.ui.sortIdeas === 'rank' ? 'rank' : 'id';
    D.ui.introDismissed = !!saved.ui.introDismissed;
    if (isObj(saved.ui.openPesq)) for (const k of Object.keys(saved.ui.openPesq)) if (saved.ui.openPesq[k]) D.ui.openPesq[k] = true;
    if (isObj(saved.ui.closedFichas)) for (const k of Object.keys(saved.ui.closedFichas)) if (saved.ui.closedFichas[k]) D.ui.closedFichas[k] = true;
  }
  if (Array.isArray(saved.weights) && saved.weights.length === 7) {
    D.weights = saved.weights.map((w, i) => {
      const n = Number(w);
      return Number.isFinite(n) && n >= 0 && n <= 99 ? n : D.weights[i];
    });
  }
  const cut = Number(saved.cutoff);
  if (saved.cutoff !== null && saved.cutoff !== '' && Number.isFinite(cut) && cut >= 0 && cut <= 5) D.cutoff = cut;

  if (Array.isArray(saved.ideas)) {
    const byId = new Map(saved.ideas.filter(isObj).map((i) => [Number(i.id), i]));
    const base = D.ideas.filter((i) => !i.extra);
    for (const it of base) {
      const sv = byId.get(it.id);
      if (sv) { it.s = sanitizeScores(sv.s); it.obs = str(sv.obs); }
    }
    const seen = new Set();
    const extras = [];
    for (const e of saved.ideas.filter(isObj)) {
      const id = Number(e.id);
      if (!e.extra || !Number.isInteger(id) || id < 17 || seen.has(id)) continue;
      seen.add(id);
      extras.push({ id, extra: true, area: str(e.area, 80) || 'Nova ideia', name: str(e.name, 4000), s: sanitizeScores(e.s), obs: str(e.obs) });
    }

  D.nextIdeaId = Math.max(Number(saved.nextIdeaId) || 19, ...D.ideas.map((i) => i.id + 1));

      const v = saved.prio[String(r[1])];
      if (PRIORIDADES.some((p) => p.v === v)) D.prio[String(r[1])] = v;

const baseInfo = (id) => SEED.ideias.base.find((b) => b.id === id);

function ideaName(id, short = false) {

function validationIdeas() {
  return S.ideas.filter((i) => !i.extra || (i.name || '').trim());

function sumWeights() { return S.weights.reduce((a, b) => a + (Number(b) || 0), 0); }

/* Equivalente a: =SE(E(CONT.NÚM(D:J)=7; $K$3>0); SOMARPRODUTO(D:J; pesos)/$K$3; "") */
function calcScore(s) {
  if (s.some((v) => v == null)) return null;
  const sumW = sumWeights();
  if (!(sumW > 0)) return null;
  let num = 0;
  for (let i = 0; i < 7; i++) num += s[i] * (Number(S.weights[i]) || 0);
  return { num, value: num / sumW };
}
/* Equivalente a: =RANK(K; K6:K23; 0) — empates compartilham a posição */
function computeRanks() {
  const list = S.ideas.map((i) => ({ id: i.id, sc: calcScore(i.s) })).filter((x) => x.sc);
  const m = new Map();
  for (const a of list) m.set(a.id, 1 + list.filter((b) => round9(b.sc.num) > round9(a.sc.num)).length);
  return m;
}
function teamStats() {
  const ranks = computeRanks();
  const total = validationIdeas().length;
  const scored = validationIdeas().filter((i) => calcScore(i.s)).length;
  return { ranks, total, scored };
}

/* ==========================================================================
   5. PRIMITIVAS DE INTERFACE
   (DOM montado com createElement/textContent: nenhum dado digitado vira HTML)
   ========================================================================== */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'data') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k in el && k !== 'list' && k !== 'form') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function makeTable({ cols, cls = '', nocard = false }) {
  let left = 0;

  cols.forEach((c) => {

  const tr = h('tr');

    const th = h('th', { class: c.cls || '', title: c.title || null }, String(c.label).replace(/\//g, '/\u200b'), c.sub ? h('div', { class: 'small', style: { fontWeight: '400', opacity: '.85' }, text: c.sub }) : null);
    if (c.sticky) { th.classList.add('sticky-l'); th.style.left = c.left + 'px'; if (c.edge) th.classList.add('sticky-edge'); }
    tr.append(th);

  const tbody = h('tbody');
  const table = h('table', { class: 'sheet ' + cls + (nocard ? ' nocard' : '') },
    h('colgroup', null, cols.map((c) => h('col', { style: { width: c.w + 'px' } }))),
    h('thead', null, tr),
    tbody);
  table.style.width = cols.reduce((a, c) => a + c.w, 0) + 'px';

/* ---------- diálogo de confirmação próprio (window.confirm falha em iframes sandbox) ---------- */
function confirmDlg({ title, message, ok = 'Confirmar', cancel = 'Cancelar', danger = false }) {
  return new Promise((resolve) => {
    if (typeof HTMLDialogElement === 'undefined' || typeof HTMLDialogElement.prototype.showModal !== 'function') {
      resolve(window.confirm(title + '\n\n' + [].concat(message).join('\n')));
      return;
    }
    const dlg = h('dialog', { class: 'dlg' });
    const okBtn = h('button', { type: 'button', class: 'btn ' + (danger ? 'dangerfill' : 'primary'), text: ok });
    const noBtn = h('button', { type: 'button', class: 'btn line', text: cancel });
    dlg.append(
      h('div', { class: 'dlg-b' }, h('h4', { text: title }), [].concat(message).map((m) => h('p', { text: m }))),
      h('div', { class: 'dlg-f' }, noBtn, okBtn),
    );
    let result = false;
    okBtn.addEventListener('click', () => { result = true; dlg.close(); });
    noBtn.addEventListener('click', () => dlg.close());
    dlg.addEventListener('close', () => { dlg.remove(); resolve(result); });
    document.body.append(dlg);
    dlg.showModal();
    noBtn.focus();
  });
}

/* ---------- navegação estilo planilha: Enter = próxima linha; ↑/↓ nas notas ---------- */
function navigate(el, dir) {
  const table = el.closest('table');
  if (!table) return false;
  const list = $$(`[data-nav="${el.dataset.nav}"]`, table).filter((x) => x.offsetParent !== null);
  const target = list[list.indexOf(el) + dir];
  if (!target) return false;
  target.focus();
  if (typeof target.select === 'function') target.select();
  return true;
}
/* clicar em qualquer ponto da célula amarela (não só na linha de texto) passa o foco ao campo */
document.addEventListener('mousedown', (e) => {
  const td = e.target;
  if (!td || td.tagName !== 'TD' || !td.classList.contains('in')) return;
  const c = td.querySelector('textarea, input:not([type="checkbox"]), select');
  if (!c) return;
  e.preventDefault();
  c.focus();
  if (c.tagName === 'TEXTAREA' || (c.tagName === 'INPUT' && c.type === 'text')) {
    try { const n = c.value.length; c.setSelectionRange(n, n); } catch (err) { /* noop */ }
  }
});
document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.nav || e.isComposing) return;
  if (el.tagName === 'INPUT') {
    if (e.key === 'Enter' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      navigate(el, e.shiftKey ? -1 : 1);
    } else if (el.dataset.arrows === '1' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      if (navigate(el, e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
    }
  }
});

  return h('div', { class: 'kpis no-print' },

}
const median = (arr) => {
  const a = arr.slice().sort((x, y) => x - y);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
};

function criterionTooltip(i) {
  const c = SEED.criterios.rows[i];
  return `${c[0]}\n${c[1]}\nNota 1: ${c[2]}\nNota 5: ${c[3]}`;
}
function ruleBadge(idea, sc) {
  if (!sc) return h('span', { class: 'muted', text: '—' });
  if (idea.s[0] < 4) return badge('bad', 'Dor < 4', 'Regra de decisão: só segue para validação com "Dor real e frequente" nota 4 ou 5.');
  if (sc.value < S.cutoff) return badge('gray', 'Abaixo do corte', `Nota final abaixo do corte definido (${fmt1(S.cutoff)}).`);
  return badge('ok', 'Segue para validação', `Nota final ≥ ${fmt1(S.cutoff)} e dor real com nota 4 ou 5.`);
}
function sortedIdeas() {
  const list = S.ideas.slice();
  if (S.ui.sortIdeas !== 'rank') return list.sort((a, b) => a.id - b.id);
  const ranks = computeRanks();
  return list.sort((a, b) => {
    const ra = ranks.get(a.id), rb = ranks.get(b.id);
    if (ra == null && rb == null) return a.id - b.id;
    if (ra == null) return 1;
    if (rb == null) return -1;
    return ra - rb || a.id - b.id;
  });
}
function addIdea() {
  const e = newExtraIdea(S.nextIdeaId++);
  S.ideas.push(e);
  touch();
  if (currentTab === 'ideias') { rerender(); focusNew(`tr[data-idea="${e.id}"] textarea`); }
  return e;
}
async function removeIdea(idea) {
  const hasData = (idea.name || '').trim() || (idea.obs || '').trim() || idea.s.some((v) => v != null);
  if (hasData) {
    const ok = await confirmDlg({
      title: `Excluir a ideia #${idea.id}?`,
      message: ['A linha, as notas e as observações serão removidas.', 'Dores do Lucas ligadas a ela ficarão sem "ideia relacionada".'],
      ok: 'Excluir', danger: true,
    });
    if (!ok) return;
  }
  S.ideas = S.ideas.filter((i) => i !== idea);
  delete S.matriz[String(idea.id)];
  delete S.pesq[String(idea.id)];
  S.pains.forEach((p) => { if (p.idea === idea.id) p.idea = null; if (p.promoted === idea.id) p.promoted = null; });
  touch();
  rerender();
  toast(`Ideia #${idea.id} removida.`);
}

    { w: 44, label: I.headers[0], cls: 'c', sticky: true },

    exK = cell('calc', 'Nota final (1–5)');
    tr.append(exK, cell('c', 'Ranking', String(ex[11])), cell('fx small', null, '—'), cell('fx small', 'Observações / fonte da nota', ex[12]), cell('no-print hide-m'));
    tbody.append(tr);
  }
  const exScores = I.example.slice(3, 3 + nCrit);

  /* linhas das ideias */
  const refs = [];
  sortedIdeas().forEach((idea, ri) => {
    const info = baseInfo(idea.id);
    const tr = h('tr', { data: { idea: idea.id } });
    tr.append(stick(cell('id', '#', String(idea.id)), cols, 0));
    if (idea.extra) {

        stick(cell('in', 'Ideia', area({ label: `Ideia ${idea.id}`, ph: 'Descreva a nova ideia…', get: () => idea.name, set: (v) => { idea.name = v; } })), cols, 2),

      td.dataset.short = CRIT_SHORT[ci];
      tr.append(td);
    }
    const k = cell('calc', 'Nota final (1–5)');
    const l = cell('calc', 'Ranking');

    tr.append(k, l, rule,

    tr.append(cell('no-print', null, idea.extra

    for (const r of refs) {
      const idea = findIdea(r.id);

    chipScored.textContent = `${ts.scored} de ${ts.total}`;
    chipRule.textContent = String(follows);
  }

  /* colar bloco copiado do Excel: preenche notas (ou pesos) a partir da célula ativa */
  table.addEventListener('paste', (e) => {
    const t = e.target;
    if (!(t instanceof HTMLInputElement) || !t.dataset.nav) return;
    const raw = (e.clipboardData || window.clipboardData).getData('text') || '';
    const clean = raw.replace(/\r/g, '').replace(/\n+$/, '');
    if (!/[\t\n]/.test(clean)) return; // valor único: comportamento normal
    e.preventDefault();
    const grid = clean.split('\n').map((ln) => ln.split('\t'));
    let ok = 0, bad = 0;
    if (t.dataset.ci !== undefined) {
      const ri = Number(t.dataset.ri), ci = Number(t.dataset.ci);

      });
    }
    toast(`Colado: ${ok} valor(es) aplicado(s)${bad ? `; ${bad} ignorado(s) por estar fora do permitido` : ''}.`, { type: bad ? 'err' : 'ok' });
  });

  updateDerived();
  return root;
};

function promotePain(p) {
  const n = S.pains.indexOf(p) + 1;
  if (!p.text.trim()) { toast('Escreva a dor antes de enviá-la para a aba Ideias.', { type: 'err' }); return; }
  if (p.promoted != null && findIdea(p.promoted)) { showTab('ideias'); return; }
  let target = S.ideas.find((i) => i.extra && !(i.name || '').trim() && !(i.obs || '').trim() && i.s.every((v) => v == null));
  if (!target) { target = newExtraIdea(S.nextIdeaId++); S.ideas.push(target); }
  target.name = p.text.trim();
  target.obs = `Origem: aba Dores do Lucas, dor nº ${n}${p.strength ? ` (força ${p.strength}/5)` : ''}. Ainda sem nota nem evidência.`;
  p.promoted = target.id;
  p.idea = target.id;
  touch();
  rerender();
  toast(`Dor nº ${n} enviada para a aba Ideias como ideia #${target.id}.`, { action: 'Ver em Ideias', onAction: () => showTab('ideias'), ms: 7000 });
}
function addPain() {
  const p = newPain();
  S.pains.push(p);
  touch();
  rerender();
  focusNew(`tr[data-pain="${p.id}"] textarea`);
}
function removePain(p) {
  const idx = S.pains.indexOf(p);
  if (idx < 0) return;
  S.pains.splice(idx, 1);
  touch();
  rerender();
  toast(`Linha ${idx + 1} removida.`, {
    action: 'Desfazer', ms: 8000,
    onAction: () => { S.pains.splice(Math.min(idx, S.pains.length), 0, p); touch(); if (currentTab === 'dores') rerender(); },
  });
}

/* ------------------------------------------------------------------ PLANO DE AÇÃO */
function parseDays(prazo) {
  const m = String(prazo).match(/(\d+)(?:\s*[–-]\s*(\d+))?/);
  if (!m) return null;
  const a = parseInt(m[1], 10);
  return [a, m[2] ? parseInt(m[2], 10) : a];
}
function planDates(start, prazo) {
  const d = parseDays(prazo);
  if (!start || !d) return '';
  const [y, mo, da] = start.split('-').map(Number);
  const f = (off) => {
    const x = new Date(y, mo - 1, da + off);
    return `${pad2(x.getDate())}/${pad2(x.getMonth() + 1)}`;
  };
  return d[0] === d[1] ? f(d[0] - 1) : `${f(d[0] - 1)} → ${f(d[1] - 1)}`;
}

    { w: 290, label: Q.headers[3] },
    { w: 274, label: Q.headers[4] },
    { w: 306, label: Q.headers[5] },
    { w: 200, label: Q.headers[6], title: 'Campo editável: acompanhe aqui o andamento real da validação humana (entrevistas, observação, protótipo, proposta).' },
    { w: 218, label: Q.headers[7] },
    { w: 108, label: 'Plano e anotações', sub: 'novo', cls: 'c no-print' },
  ];
  const { wrap, tbody } = makeTable({ cols });

  validationIdeas().forEach((idea) => {
    const pq = getPesq(idea.id);
    const row = Q.rows.find((r) => r.id === idea.id);
    const tr = h('tr', { data: { idea: idea.id } });
    const stTd = cell('in', Q.headers[6]);
    const paint = () => {
      STATUS_VALIDACAO.forEach((s) => stTd.classList.remove(s.cls));
      const c = STATUS_VALIDACAO.find((s) => s.v === pq.status);
      if (c) stTd.classList.add(c.cls);
    };
    stTd.append(sel({ label: `Status da validação humana — ideia ${idea.id}`, options: STATUS_VALIDACAO.map((s) => s.v), get: () => pq.status, set: (v) => { pq.status = v; }, after: () => { paint(); updChips(); } }));
    paint();

    const btn = h('button', { type: 'button', class: 'btn small line' });
    const setBtn = () => { btn.replaceChildren(...[S.ui.openPesq[String(idea.id)] ? 'Fechar' : 'Planejar', pesqHasPlan(pq) ? h('span', { class: 'pip', title: 'Há campos preenchidos' }) : null].filter(Boolean)); };
    setBtn();

    const mk = (tdRow) => tdRow;
    tr.append(
      stick(cell('id', Q.headers[0], String(idea.id)), cols, 0),
      stick(cell('fx', Q.headers[1], h('b', { text: row ? row.short : ideaName(idea.id) })), cols, 1),
      cell('c fx', Q.headers[2], row ? row.prelim : '—'),
      cell('fx small', Q.headers[3], row ? row.found : 'Ainda sem pesquisa documental (ideia adicionada pela equipe).'),
      cell('fx small', Q.headers[4], row ? row.gap : '—'),
      cell('fx small', Q.headers[5], row ? row.next : 'Defina o próximo teste na aba Matriz de validação.'),
      stTd,
      cell('fx small', Q.headers[7], row ? link(DOCS_URL + row.report, row.report) : '—'),
      cell('c no-print', null, btn));
    tbody.append(tr);

    /* linha de detalhe (campos de decisão da Fase 4) */
    const detail = h('tr', { class: 'detail', data: { detailFor: idea.id } });
    const inner = h('div', { class: 'detail-inner' },
      h('div', { class: 'small muted', style: { marginBottom: '8px' }, text: `Campos de decisão da Fase 4 — todos PENDENTE-HUMANO: Will/Lucas definem; nada aqui foi estimado pelo agente. (Ideia #${idea.id})` }),
      h('div', { class: 'detail-grid' },
        field('Responsável por executar e custodiar os dados', ctl(txt({ label: 'Responsável', ph: 'PENDENTE-HUMANO', get: () => pq.owner, set: (v) => { pq.owner = v; }, after: setBtn }))),
        field('Número e perfil dos participantes', ctl(area({ label: 'Participantes', ph: 'PENDENTE-HUMANO', get: () => pq.people, set: (v) => { pq.people = v; }, after: setBtn }))),
        field('Custo máximo e recursos disponíveis', ctl(area({ label: 'Custo máximo', ph: 'PENDENTE-HUMANO', get: () => pq.budget, set: (v) => { pq.budget = v; }, after: setBtn }))),
        field('Prazo das entrevistas / piloto', ctl(txt({ label: 'Prazo', ph: 'PENDENTE-HUMANO', get: () => pq.deadline, set: (v) => { pq.deadline = v; }, after: setBtn }))),
        field('Limiar para continuar/parar', ctl(area({ label: 'Limiar', ph: 'PENDENTE-HUMANO — defina ANTES de coletar', get: () => pq.threshold, set: (v) => { pq.threshold = v; }, after: setBtn })), 'Combine antes de executar o teste.'),
        field('Anotações e evidências humanas', ctl(area({ label: 'Anotações', ph: 'Fatos, relatos e interpretações — separados', get: () => pq.notes, set: (v) => { pq.notes = v; }, after: setBtn })))));
    const dtd = h('td', { colSpan: cols.length }, inner);
    detail.append(dtd);
    detail.hidden = !S.ui.openPesq[String(idea.id)];
    btn.addEventListener('click', () => {
      const k = String(idea.id);
      S.ui.openPesq[k] = !S.ui.openPesq[k];
      detail.hidden = !S.ui.openPesq[k];
      setBtn();
      touch();
      if (!detail.hidden) { flushAutosize(); }
    });
    tbody.append(detail);
  });
  root.append(wrap);
  updChips();
  return root;
};

function addFicha() {
  const f = newFicha();
  S.fichas.push(f);
  touch();
  rerender();
  focusNew(`[data-ficha="${f.id}"] input, [data-ficha="${f.id}"] textarea`);
}
async function removeFicha(f) {
  if (FICHA_KEYS.some((k) => (f[k] || '').trim())) {
    const ok = await confirmDlg({ title: 'Excluir esta ficha?', message: 'Todo o conteúdo da ficha será removido. Esta ação não pode ser desfeita.', ok: 'Excluir', danger: true });
    if (!ok) return;
  }
  S.fichas = S.fichas.filter((x) => x !== f);
  delete S.ui.closedFichas[f.id];
  touch();
  rerender();
}
function fichaTitle(f, n) {
  const parts = [`Ficha ${n}`];
  if (f.date) { const [y, m, d] = f.date.split('-'); parts.push(`${d}/${m}/${y}`); }
  if (f.ids.trim()) parts.push(`ideia(s): ${f.ids.trim()}`);
  if (f.role.trim()) parts.push(f.role.trim().split('\n')[0].slice(0, 60));
  return parts.join(' · ');
}

    const body = h('div', { class: 'card-b' },
      h('div', { class: 'sec', text: 'Identificação' }),
      h('div', { class: 'detail-grid' },
        I('ids', 'Ex.: ideia 12 · hipótese v1'),
        I('date', '', 'date'),
        P('mode', MODALIDADES),
        I('who', 'Quem conduziu'),
        T('role', 'Sem nome de empresa'),
        T('consent', 'O que foi autorizado')),
      h('div', { class: 'sec', text: 'O que aconteceu' }),
      h('div', { class: 'detail-grid' },
        T('episode', 'Conte a última vez que…'),
        T('tool'),
        T('artifact'),
        T('fact', 'O que você viu acontecer'),
        T('report', 'Palavras dele, literais quando possível'),
        T('interp', 'O que você acha que isso significa')),
      h('div', { class: 'sec', text: 'Números e decisão' }),
      h('div', { class: 'detail-grid' },
        T('numbers', 'Medido ou só memória?'),
        T('buyer'),
        T('alts'),
        T('objections'),
        P('commit', COMPROMISSOS),
        T('commitNote', 'Quem, o quê e quando')),
      h('div', { class: 'sec', text: 'Fechamento' }),
      h('div', { class: 'detail-grid' },
        T('bias'),

    card.append(head, body);
    root.append(card);
  });
  if (S.fichas.length > 2) root.append(h('div', { class: 'toolbar no-print' }, h('button', { type: 'button', class: 'btn primary', text: '+ Nova ficha', onclick: addFicha })));

};

const PRIO_FILL = { 'Validar primeiro': 'FFDCFCE7', 'Validar depois': 'FFFEF3C7', 'Baixa prioridade': 'FFFEE2E2', 'Descartada (decisão humana)': 'FFE5E7EB' };

function buildWorkbook() {
  const wb = new XLSX_MIN.Workbook({ title: 'Pesquisa de ideias — Will & Lucas (exportado da versão HTML editável)', creator: 'Will & Lucas' });
  const I = SEED.ideias;
  const ranks = computeRanks();
  const nW = I.criteria.length;
  const ideasSorted = S.ideas.slice().sort((a, b) => a.id - b.id);
  const FIRST = 6;
  const LAST = 5 + ideasSorted.length;
  const pct = (n) => n; // valor em cache com precisão total; o Excel recalcula ao abrir

  /* ---------------- Análise ---------------- */
  {
    const A = SEED.analise;
    const ws = wb.addSheet('Análise');
    ws.set(1, 1, A.title, XF.t2).merge(1, 1, 1, 16).height(1, 30);
    ws.set(2, 1, A.warn, XF.warn2).merge(2, 1, 2, 16).height(2, 32);
    ws.set(4, 1, A.section, XF.sec2);
    A.headers.forEach((t, i) => ws.set(5, i + 1, t, XF.h2));
    ws.set(5, 15, 'Nota da equipe (aba Ideias)', XF.h2).set(5, 16, 'Rank da equipe (aba Ideias)', XF.h2).height(5, 34);
    A.rows.forEach((r, i) => {
      const row = 6 + i, id = Number(r[1]);
      [0, 1].forEach((c) => ws.set(row, c + 1, r[c], XF.b2));
      ws.set(row, 3, r[2], XF.b2).set(row, 4, r[3], XF.b2);
      for (let c = 4; c <= 10; c++) ws.set(row, c + 1, r[c], XF.b2);
      ws.set(row, 12, r[11], XF.b2n);
      ws.set(row, 13, S.prio[String(id)], XF.prio(PRIO_FILL[S.prio[String(id)]] || 'FFE5E7EB'));
      ws.set(row, 14, r[13], XF.b2);
      const idea = findIdea(id), sc = idea ? calcScore(idea.s) : null;
      ws.set(row, 15, { f: `IFERROR(INDEX(Ideias!$K$${FIRST}:$K$${LAST},MATCH($B${row},Ideias!$A$${FIRST}:$A$${LAST},0)),"")`, v: sc ? pct(sc.value) : '' }, XF.calc2n);
      ws.set(row, 16, { f: `IFERROR(INDEX(Ideias!$L$${FIRST}:$L$${LAST},MATCH($B${row},Ideias!$A$${FIRST}:$A$${LAST},0)),"")`, v: sc ? ranks.get(id) : '' }, XF.calc2);
    });
    ws.set(25, 1, A.execTitle, XF.sec2);
    A.exec.forEach((t, i) => { ws.set(26 + i, 1, t, XF.b2).merge(26 + i, 1, 26 + i, 16).height(26 + i, 32); });
    [8, 6, 20, 55, 8, 11, 10, 13, 14, 8, 11, 14, 22, 62, 16, 14].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.list('M6:M21', PRIORIDADES.map((p) => p.v));
    ws.freeze = { row: 6, col: 1 };
    ws.filter = 'A5:P21';
    ws.scale('L6:L21', [{ type: 'min' }, { type: 'percentile', val: 50 }, { type: 'max' }], ['FFFEE2E2', 'FFFEF3C7', 'FFDCFCE7']);
  }

  /* ---------------- Como usar ---------------- */
  {
    const ws = wb.addSheet('Como usar');
    ws.landscape = false;
    SEED.comoUsar.forEach((line, i) => {
      const t = String(line || '');
      if (!t) return;
      if (i === 0) ws.set(1, 1, t, { font: { name: 'Arial', sz: 14, b: true, color: 'FF1F3864' }, v: 'top', wrap: true }).height(1, 20);
      else ws.set(i + 1, 1, t, t.startsWith('•') ? XF.text : XF.bold);
    });
    ws.width(1, 1, 115);
  }

  /* ---------------- Ideias ---------------- */
  {
    const ws = wb.addSheet('Ideias');
    const wsum = sumWeights();
    ws.set(1, 1, I.title, XF.t1);
    ws.set(2, 1, I.subtitle, XF.sub);
    ws.set(3, 3, 'Peso →', XF.boldR);
    for (let k = 0; k < nW; k++) ws.set(3, 4 + k, S.weights[k], XF.inc);
    ws.set(3, 11, { f: 'SUM(D3:J3)', v: wsum }, XF.calcg);
    ws.set(3, 12, '← soma dos pesos', XF.sub);
    ws.set(2, 14, 'Corte da nota final (regra de decisão):', XF.sub);
    ws.set(3, 14, S.cutoff, XF.incOne);
    I.headers.forEach((t, i) => ws.set(4, i + 1, t, XF.hdr));
    ws.set(4, 14, 'Regra de decisão', XF.hdrNew).height(4, 54.75);
    /* linha de exemplo */
    const ex = I.example;
    const exSc = calcScore(ex.slice(3, 3 + nW));
    ws.set(5, 1, ex[0], XF.exC).set(5, 2, ex[1], XF.exC).set(5, 3, ex[2], XF.exF);
    for (let k = 0; k < nW; k++) ws.set(5, 4 + k, ex[3 + k], XF.exC);
    ws.set(5, 11, { f: 'IF(AND(COUNT(D5:J5)=7,$K$3>0),SUMPRODUCT(D5:J5,$D$3:$J$3)/$K$3,"")', v: exSc ? pct(exSc.value) : '' }, XF.exN);
    ws.set(5, 12, ex[11], XF.exC).set(5, 13, ex[12], XF.exF);
    /* ideias */
    ideasSorted.forEach((it, i) => {
      const r = FIRST + i;
      const sc = calcScore(it.s);
      ws.set(r, 1, it.id, XF.fixc);
      if (it.extra) {
        ws.set(r, 2, it.area, XF.inp).set(r, 3, it.name, XF.inp);
      } else {
        const b = baseInfo(it.id);
        ws.set(r, 2, b.area, XF.fix).set(r, 3, b.name, XF.fix);
      }
      for (let k = 0; k < nW; k++) ws.set(r, 4 + k, it.s[k], XF.inc);
      ws.set(r, 11, { f: `IF(AND(COUNT(D${r}:J${r})=7,$K$3>0),SUMPRODUCT(D${r}:J${r},$D$3:$J$3)/$K$3,"")`, v: sc ? pct(sc.value) : '' }, XF.calc);
      ws.set(r, 12, { f: `IF(K${r}="","",RANK(K${r},$K$${FIRST}:$K$${LAST},0))`, v: sc ? ranks.get(it.id) : '' }, XF.calcg);
      ws.set(r, 13, it.obs, XF.inp);
      const rule = !sc ? '' : it.s[0] < 4 ? 'Dor < 4' : sc.value < S.cutoff ? 'Abaixo do corte' : 'Segue para validação';
      ws.set(r, 14, { f: `IF(K${r}="","",IF(D${r}<4,"Dor < 4",IF(K${r}<$N$3,"Abaixo do corte","Segue para validação")))`, v: rule }, XF.calcT);
    });
    [5, 20, 52, 13, 15, 17, 13, 13, 13, 12, 10, 40, 24].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.whole(`D5:J${LAST}`, 1, 5, 'Nota inválida', 'Use um número inteiro de 1 a 5.');
    ws.freeze = { row: 5, col: 4 };
    ws.scale(`K${FIRST}:K${LAST}`, [{ type: 'num', val: 1 }, { type: 'num', val: 3 }, { type: 'num', val: 5 }], ['FFF8696B', 'FFFFEB84', 'FF63BE7B']);
  }

  /* ---------------- Critérios ---------------- */
  {
    const C = SEED.criterios;
    const ws = wb.addSheet('Critérios');
    ws.set(1, 1, C.title, XF.t1);
    C.headers.forEach((t, i) => ws.set(3, i + 1, t, XF.hdr));
    ws.set(3, 5, 'Peso atual', XF.hdrNew);
    C.rows.forEach((r, i) => {
      ws.set(4 + i, 1, r[0], XF.fixb).set(4 + i, 2, r[1], XF.fix).set(4 + i, 3, r[2], XF.fix).set(4 + i, 4, r[3], XF.fix);
      ws.set(4 + i, 5, { f: `Ideias!${XLSX_MIN.colName(4 + i)}$3`, v: S.weights[i] }, XF.calcg);
    });
    [34, 44, 46, 52, 12].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.landscape = false;
  }

  /* ---------------- Roteiro Lucas ---------------- */
  {
    const R = SEED.roteiro;
    const ws = wb.addSheet('Roteiro Lucas');
    ws.set(1, 1, R.title, XF.t1);
    ws.set(2, 1, R.rules, XF.subw).merge(2, 1, 2, 5).height(2, 44);
    R.headers.forEach((t, i) => ws.set(4, i + 1, t, XF.hdr));
    R.rows.forEach((r, i) => {
      const row = 5 + i;
      ws.set(row, 1, r[0], XF.fixb).set(row, 2, r[1], XF.fix).set(row, 3, r[2], XF.fix).set(row, 4, r[3], XF.fix);
      ws.set(row, 5, S.roteiro.notes[String(i)] || '', XF.inp);
    });
    const m = S.roteiro.meta, b = 5 + R.rows.length + 2;

    const meta = [['Data da conversa', XLSX_MIN.excelDate(m.date), XF.incDate], ['Modalidade', m.mode, XF.inp], ['Quem conduziu', m.who, XF.inp],

    meta.forEach(([label, val, st], i) => {
      ws.set(b + 1 + i, 1, label, XF.fixb).set(b + 1 + i, 2, null, XF.fixb);

      ws.set(b + 1 + i, 4, null, st).set(b + 1 + i, 5, null, st);

  }

  /* ---------------- Dores do Lucas ---------------- */
  {
    const D = SEED.dores;

    ws.set(2, 1, D.subtitle, XF.sub);
    D.headers.forEach((t, i) => ws.set(4, i + 1, t, XF.hdr));
    ws.set(4, 10, 'Virou a ideia nº', XF.hdrNew).height(4, 45);
    D.example.forEach((v, i) => ws.set(5, i + 1, v, i === 0 ? XF.exC : XF.exF));
    S.pains.forEach((p, i) => {
      const r = 6 + i;
      ws.set(r, 1, i + 1, XF.fix);
      ws.set(r, 2, p.text, XF.inp).set(r, 3, p.freq, XF.inp).set(r, 4, p.loss, XF.inp).set(r, 5, p.today, XF.inp).set(r, 6, p.who, XF.inp).set(r, 7, p.payer, XF.inp);
      ws.set(r, 8, p.idea, XF.inp).set(r, 9, p.strength, XF.inp);

    [5, 52, 18, 22, 28, 22, 20, 20, 14, 16].forEach((w, i) => ws.width(i + 1, i + 1, w));
    if (S.pains.length) ws.whole(`I6:I${5 + S.pains.length}`, 1, 5, 'Nota inválida', 'Use um número inteiro de 1 a 5.');

  }

  /* ---------------- Matriz de validação ---------------- */
  {
    const M = SEED.matriz;
    const ws = wb.addSheet('Matriz de validação');
    ws.set(1, 1, M.title, XF.t2).merge(1, 1, 1, 12).height(1, 26);
    ws.set(2, 1, M.rule, XF.warn2).merge(2, 1, 2, 12).height(2, 30);
    M.headers.forEach((t, i) => ws.set(4, i + 1, t, XF.h2));

    const list = validationIdeas();
    list.forEach((it, i) => {

      ws.set(r, 11, mx.lvl, XF.in2);
      ws.set(r, 12, { f: `COUNTA(C${r}:I${r})&"/7"`, v: `${matrizFilled(mx)}/7` }, XF.calc2);

    const last = 4 + list.length;
    [6, 55, 35, 30, 24, 22, 22, 28, 20, 55, 28, 16].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.list(`K5:K${last}`, NIVEIS_EVIDENCIA.filter(Boolean));

  }

  /* ---------------- Plano de ação ---------------- */
  {
    const P = SEED.plano;
    const ws = wb.addSheet('Plano de ação');
    ws.set(1, 1, P.title, XF.t2).merge(1, 1, 1, 11).height(1, 26);
    ws.set(2, 1, 'Data de início (Dia 1):', { font: { name: 'Calibri', sz: 11, b: true }, v: 'center' });
    ws.set(2, 2, XLSX_MIN.excelDate(S.plano.start), XF.in2d);
    P.headers.forEach((t, i) => ws.set(3, i + 1, t, XF.h2));
    ['Datas previstas', 'Status', 'Responsável', 'Critério de avanço atingido?', 'Resultado / evidência'].forEach((t, i) => ws.set(3, 7 + i, t, XF.h2));
    const f = (off) => { const [y, mo, d] = S.plano.start.split('-').map(Number); const x = new Date(y, mo - 1, d + off); return `${pad2(x.getDate())}/${pad2(x.getMonth() + 1)}`; };
    P.rows.forEach((r, i) => {
      const row = 4 + i, st = S.plano.steps[i];
      r.forEach((v, c) => ws.set(row, c + 1, v, XF.b2));
      const d = parseDays(r[5]);
      let formula = '""', cached = '';
      if (d) {
        const t1 = `TEXT($B$2+${d[0] - 1},"dd/mm")`, t2 = `TEXT($B$2+${d[1] - 1},"dd/mm")`;
        formula = `IF($B$2="","",${d[0] === d[1] ? t1 : `${t1}&" → "&${t2}`})`;
        if (S.plano.start) cached = d[0] === d[1] ? f(d[0] - 1) : `${f(d[0] - 1)} → ${f(d[1] - 1)}`;
      }
      ws.set(row, 7, { f: formula, v: cached }, XF.calc2);
      ws.set(row, 8, st.status, XF.in2).set(row, 9, st.owner, XF.in2).set(row, 10, st.crit, XF.in2c).set(row, 11, st.result, XF.in2);
    });
    const dr = 4 + P.rows.length + 1;
    ws.set(dr, 1, 'Decisão final (etapa 7):', { font: { name: 'Calibri', sz: 11, b: true }, v: 'center' });
    ws.set(dr, 2, S.plano.steps[P.rows.length - 1].decision, XF.in2);
    [18, 25, 48, 32, 42, 18, 18, 18, 22, 22, 50].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.list(`H4:H${3 + P.rows.length}`, STATUS_PLANO.map((s) => s.v));
    ws.list(`J4:J${3 + P.rows.length}`, CRITERIO_ATINGIDO.filter(Boolean));
    ws.list(`B${dr}`, DECISOES.filter(Boolean));
    ws.freeze = { row: 4, col: 1 };
  }

  /* ---------------- Fontes ---------------- */
  {
    const F = SEED.fontes;
    const ws = wb.addSheet('Fontes');
    ws.set(1, 1, F.title, XF.t2).merge(1, 1, 1, 6).height(1, 26);
    F.headers.forEach((t, i) => ws.set(3, i + 1, t, XF.h2));
    ws.set(3, 5, 'Verificação (Fase 1)', XF.h2).set(3, 6, 'Notas / data de acesso', XF.h2);
    F.rows.forEach((r, i) => {
      const row = 4 + i, v = FONTES_FASE1[i];
      r.forEach((t, c) => ws.set(row, c + 1, t, XF.b2));
      ws.set(row, 5, v ? `${v.tag.toUpperCase()}: ${v.text}` : '', XF.b2);
      ws.set(row, 6, S.fontes.notes[String(i)] || '', XF.in2);
    });
    S.fontes.extra.forEach((f, i) => {
      const row = 4 + F.rows.length + i;
      ws.set(row, 1, f.tema, XF.in2).set(row, 2, f.fonte, XF.in2).set(row, 3, f.sustenta, XF.in2).set(row, 4, f.url, XF.in2).set(row, 5, f.status, XF.in2);
      const d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f.date);
      ws.set(row, 6, d ? `Acessada em ${d[3]}/${d[2]}/${d[1]}` : '', XF.in2);
    });
    [18, 32, 70, 85, 70, 34].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.freeze = { row: 4, col: 1 };
  }

  /* ---------------- Pesquisa documental ---------------- */
  {
    const Q = SEED.pesquisa;
    const ws = wb.addSheet('Pesquisa documental');
    ws.zoom = 85;
    ws.set(1, 1, Q.title, XF.t2).merge(1, 1, 1, 14).height(1, 26);
    ws.set(2, 1, Q.subtitle, XF.warn2).merge(2, 1, 2, 14).height(2, 42);
    Q.headers.forEach((t, i) => ws.set(4, i + 1, t, XF.h2));
    ['Responsável e custódia dos dados', 'Nº e perfil dos participantes', 'Custo máximo e recursos', 'Prazo', 'Limiar para continuar/parar', 'Anotações e evidências humanas'].forEach((t, i) => ws.set(4, 9 + i, t, XF.h2));
    ws.height(4, 54);
    const list = validationIdeas();
    list.forEach((it, i) => {
      const r = 5 + i, row = Q.rows.find((x) => x.id === it.id), pq = getPesq(it.id);
      ws.set(r, 1, it.id, XF.b2c).set(r, 2, row ? row.short : ideaName(it.id), XF.b2).set(r, 3, row ? row.prelim : '—', XF.b2c);
      ws.set(r, 4, row ? row.found : 'Ainda sem pesquisa documental (ideia adicionada pela equipe).', XF.b2).set(r, 5, row ? row.gap : '—', XF.b2).set(r, 6, row ? row.next : 'Defina o próximo teste na aba Matriz de validação.', XF.b2);
      ws.set(r, 7, pq.status, XF.in2).set(r, 8, row ? row.report : '', XF.b2);
      ['owner', 'people', 'budget', 'deadline', 'threshold', 'notes'].forEach((k, j) => ws.set(r, 9 + j, pq[k], XF.in2));
    });
    const last = 4 + list.length;
    [7, 34, 30, 62, 55, 70, 38, 48, 28, 30, 30, 18, 34, 44].forEach((w, i) => ws.width(i + 1, i + 1, w));
    ws.list(`G5:G${last}`, STATUS_VALIDACAO.map((s) => s.v));
    ws.freeze = { row: 5, col: 1 };
    ws.filter = `A4:N${last}`;
  }

  /* ---------------- Registro de entrevistas ---------------- */
  {
    const ws = wb.addSheet('Registro de entrevistas');
    ws.set(1, 1, 'Registro de entrevistas e testes', XF.t2).merge(1, 1, 1, 12).height(1, 26);
    ws.set(2, 1, 'Uma linha por entrevista/teste, a partir do modelo em branco da Fase 4. Separe fato observado, relato do participante e interpretação. Não registre dados confidenciais.', XF.warn2).merge(2, 1, 2, 12).height(2, 32);
    const labels = FICHA_LABELS;
    ws.set(4, 1, 'Ficha', XF.h2);
    FICHA_KEYS.forEach((k, i) => ws.set(4, 2 + i, labels[k], XF.h2));
    ws.height(4, 48);
    S.fichas.forEach((f, n) => {
      const r = 5 + n;
      ws.set(r, 1, n + 1, XF.b2c);
      FICHA_KEYS.forEach((k, i) => {
        if (k === 'date') ws.set(r, 2 + i, XLSX_MIN.excelDate(f.date), XF.in2d);
        else ws.set(r, 2 + i, f[k], XF.in2);
      });
    });
    ws.width(1, 1, 8);
    FICHA_KEYS.forEach((k, i) => ws.width(2 + i, 2 + i, k === 'date' || k === 'mode' || k === 'commit' ? 18 : k === 'ids' || k === 'who' ? 22 : 38));
    if (S.fichas.length) { ws.list(`D5:D${4 + S.fichas.length}`, MODALIDADES.filter(Boolean)); }
    ws.freeze = { row: 5, col: 2 };
  }
  return wb;
}

function exportXlsx() {
  try {
    const blob = buildWorkbook().toBlob();
    downloadBlob(`pesquisa-ideias-will-lucas_preenchida_${stamp()}.xlsx`, blob);
    toast('Excel gerado com as abas e os dados atuais. Nota final e ranking saem como fórmulas.', { type: 'ok', ms: 5200 });
  } catch (e) {
    console.error(e);
    toast('Não foi possível gerar o Excel: ' + (e && e.message ? e.message : e), { type: 'err', ms: 7000 });
  }
}

/* ---------------- backup JSON ---------------- */
function exportBackup() {
  S.meta.lastBackupAt = nowIso();
  const payload = Object.assign({}, S, { exportedAt: S.meta.lastBackupAt });
  downloadBlob(`backup-pesquisa-ideias_${stamp()}.json`, new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
  saveNow();
  updateBackupPip();
  toast('Backup baixado. Guarde o arquivo: ele restaura tudo em qualquer navegador.', { type: 'ok', ms: 5200 });
}
function summarize(st) {
  const scored = st.ideas.filter((i) => i.s.every((v) => v != null)).length;
  return `${scored} ideia(s) pontuada(s), ${st.pains.filter((p) => p.text.trim()).length} dor(es), ${st.fichas.length} ficha(s)`;
}
function applyState(next, msg) {
  S = next;
  S.meta.changedAt = nowIso();
  saveNow();
  renderCurrent();
  updateBackupPip();
  toast(msg, { type: 'ok', ms: 5200 });
}
async function importBackupFile(file) {
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch (e) { toast('Arquivo inválido: não é um JSON legível.', { type: 'err' }); return; }
  if (!isObj(parsed) || parsed.app !== APP_ID) { toast('Este arquivo não é um backup desta planilha.', { type: 'err', ms: 6000 }); return; }
  const next = sanitizeState(parsed);
  const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString('pt-BR') : 'data desconhecida';
  const ok = await confirmDlg({
    title: 'Carregar este backup?',
    message: [`Backup de ${when}: ${summarize(next)}.`, `Os dados atuais (${summarize(S)}) serão substituídos. Você poderá desfazer logo em seguida.`],
    ok: 'Carregar backup', danger: true,
  });
  if (!ok) return;
  const prev = JSON.stringify(S);
  applyState(next, 'Backup carregado.');
  toast('Backup carregado.', { type: 'ok', ms: 9000, action: 'Desfazer', onAction: () => applyState(sanitizeState(JSON.parse(prev)), 'Dados anteriores restaurados.') });
}
async function resetAll() {
  const ok = await confirmDlg({
    title: 'Apagar todos os dados preenchidos?',
    message: ['Notas, pesos, dores, anotações, fichas e status voltam ao estado inicial da planilha.', 'Se ainda não baixou um backup, baixe antes. Você poderá desfazer logo em seguida.'],
    ok: 'Apagar tudo', danger: true,
  });
  if (!ok) return;
  const prev = JSON.stringify(S);
  const keepIntro = S.ui.introDismissed;
  const fresh = defaultState();
  fresh.ui.introDismissed = keepIntro;
  applyState(fresh, 'Dados apagados.');
  toast('Dados apagados.', { type: 'ok', ms: 9000, action: 'Desfazer', onAction: () => applyState(sanitizeState(JSON.parse(prev)), 'Dados restaurados.') });
}
function printTab() {
  try { window.print(); } catch (e) { toast('A impressão está bloqueada neste ambiente. Use "Exportar Excel" ou o menu do navegador.', { type: 'err', ms: 6000 }); }
}

/* ==========================================================================
   9. INICIALIZAÇÃO: barra superior, abas, avisos, roteamento
   ========================================================================== */
let currentTab = 'analise';

function renderCurrent() {
  const panel = $('#panel');
  let node;
  try {
    node = RENDERERS[currentTab]();
  } catch (e) {
    console.error(e);
    node = h('div', null, callout('warn', 'Não foi possível montar esta aba (' + (e && e.message ? e.message : e) + '). Seus dados estão preservados: baixe um backup e recarregue a página.'));
  }
  panel.replaceChildren(node);
  flushAutosize();
}

function showTab(id) {
  if (!TAB_IDS.includes(id)) id = 'analise';
  currentTab = id;
  S.ui.tab = id;
  $$('.tab').forEach((b) => {
    const on = b.dataset.tab === id;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
    if (on && b.scrollIntoView) b.scrollIntoView({ inline: 'center', block: 'nearest' });
  });
  renderCurrent();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* ambientes com iframe restrito */ }
  window.scrollTo(0, 0);
}

function syncSticky() {
  const top = $('#topbar'), tabs = $('#tabs');
  if (!top || !tabs) return;
  const th = top.offsetHeight, tb = tabs.offsetHeight;
  const root = document.documentElement.style;
  root.setProperty('--topbar-h', th + 'px');
  root.setProperty('--sticky-h', th + tb + 'px');
}

function renderNotices() {
  const box = $('#notices');
  const items = [];
  if (!STORAGE_OK) {
    items.push(h('div', { class: 'callout warn no-print', style: { margin: '8px 16px', fontStyle: 'normal' } },
      h('b', { text: 'Atenção: este navegador bloqueou o armazenamento local. ' }),
      'Você pode preencher normalmente, mas as alterações não ficam salvas se a página for fechada. Use "Baixar backup" (ou "Exportar Excel") antes de sair — e "Mais → Carregar backup" para continuar depois.'));
  }
  if (!S.ui.introDismissed) {
    items.push(h('div', { class: 'callout info no-print', style: { margin: '8px 16px' } },
      h('b', { text: 'Versão editável da planilha. ' }),
      'Preencha os campos amarelos (texto azul); o que é cinza é calculado. Tudo é salvo automaticamente ',
      h('b', { text: 'somente neste navegador' }),
      ' — use "Baixar backup" para guardar uma cópia ou enviar ao parceiro, e "Exportar Excel" para voltar ao .xlsx. ',
      h('button', { type: 'button', class: 'btn small line', style: { marginLeft: '8px' }, text: 'Entendi', onclick: () => { S.ui.introDismissed = true; touch(); renderNotices(); syncSticky(); } })));
  }
  box.replaceChildren(...items);
}

function buildChrome() {
  const fileInput = h('input', { type: 'file', accept: '.json,application/json', hidden: true, id: 'file-import' });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    importBackupFile(f);
  });
  const menu = h('details', { class: 'menu' });
  const closeMenu = () => { menu.open = false; };
  menu.append(
    h('summary', { class: 'btn ghost', text: 'Mais' }),
    h('div', { class: 'menu-list' },
      h('button', { type: 'button', text: 'Carregar backup (.json)…', onclick: () => { closeMenu(); fileInput.click(); } }),
      h('button', { type: 'button', text: 'Imprimir esta aba', onclick: () => { closeMenu(); printTab(); } }),
      h('hr'),
      h('button', { type: 'button', class: 'danger', text: 'Apagar todos os dados…', onclick: () => { closeMenu(); resetAll(); } })));
  document.addEventListener('click', (e) => { if (menu.open && !menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && menu.open) closeMenu(); });

  $('#topbar').replaceChildren(
    h('div', { class: 'brand' }, h('h1', { text: 'Pesquisa de ideias — Will & Lucas' }), h('span', { class: 'tag', text: 'versão editável' })),
    h('div', { class: 'actions' },
      h('span', { id: 'save-status', class: 'save-status' }),
      h('button', { type: 'button', id: 'btn-backup', class: 'btn primary', text: 'Baixar backup', onclick: exportBackup }),
      h('button', { type: 'button', id: 'btn-xlsx', class: 'btn ghost', text: 'Exportar Excel', onclick: exportXlsx }),
      menu, fileInput));

  const nav = $('#tabs');
  nav.setAttribute('role', 'tablist');
  nav.setAttribute('aria-label', 'Abas da planilha');
  nav.replaceChildren(...TABS.map((t) => h('button', {
    type: 'button', class: 'tab', role: 'tab', data: { tab: t.id }, 'aria-selected': 'false',
    onclick: () => showTab(t.id),
  }, t.label, t.isNew ? h('span', { class: 'new', text: 'novo' }) : null)));
  nav.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = TAB_IDS.indexOf(currentTab) + (e.key === 'ArrowRight' ? 1 : -1);
    const next = TAB_IDS[(i + TAB_IDS.length) % TAB_IDS.length];
    showTab(next);
    const b = $(`.tab[data-tab="${next}"]`);
    if (b) b.focus();
    e.preventDefault();
  });
}

function boot() {
  S = loadState();
  buildChrome();
  renderNotices();
  syncSticky();
  window.addEventListener('resize', syncSticky);
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(syncSticky);
    ro.observe($('#topbar'));
    ro.observe($('#tabs'));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncSticky);

  const fromHash = decodeURIComponent((location.hash || '').slice(1));
  showTab(TAB_IDS.includes(fromHash) ? fromHash : S.ui.tab);
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent((location.hash || '').slice(1));
    if (TAB_IDS.includes(id) && id !== currentTab) showTab(id);
  });

  if (!STORAGE_OK) setSaveStatus('error');
  else if (S.meta.changedAt) setSaveStatus('saved', 'Dados recuperados deste navegador (última alteração: ' + new Date(S.meta.changedAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) + ')');
  else setSaveStatus('idle');
  updateBackupPip();

  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('beforeunload', (e) => {
    saveNow();
    if (!STORAGE_OK && S.meta.changedAt && (!S.meta.lastBackupAt || S.meta.changedAt > S.meta.lastBackupAt)) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('error', (e) => { console.error(e.error || e.message); toast('Ocorreu um erro inesperado. Seus dados continuam salvos; se algo parecer errado, baixe um backup e recarregue.', { type: 'err', ms: 7000 }); });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
